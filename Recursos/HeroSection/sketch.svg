<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none" stroke="#000" stroke-width="0.8">
  <!-- Floor line -->
  <line x1="40" y1="430" x2="360" y2="430"/>
  <!-- Right wall -->
  <line x1="360" y1="430" x2="360" y2="160"/>
  <!-- Roof right -->
  <line x1="360" y1="160" x2="200" y2="60"/>
  <!-- Roof left -->
  <line x1="200" y1="60" x2="40" y2="160"/>
  <!-- Left wall -->
  <line x1="40" y1="160" x2="40" y2="430"/>
  <!-- Window left -->
  <rect x="80" y="240" width="60" height="80" rx="2"/>
  <line x1="110" y1="240" x2="110" y2="320"/>
  <line x1="80" y1="280" x2="140" y2="280"/>
  <!-- Window right -->
  <rect x="260" y="240" width="60" height="80" rx="2"/>
  <line x1="290" y1="240" x2="290" y2="320"/>
  <line x1="260" y1="280" x2="320" y2="280"/>
  <!-- Door -->
  <rect x="170" y="300" width="50" height="130" rx="2"/>
  <circle cx="208" cy="368" r="3"/>
  <!-- Dimension lines floor -->
  <line x1="40" y1="445" x2="360" y2="445" stroke-dasharray="3 3"/>
  <line x1="40" y1="435" x2="40" y2="455"/>
  <line x1="360" y1="435" x2="360" y2="455"/>
  <!-- Dimension line height right -->
  <line x1="375" y1="160" x2="375" y2="430" stroke-dasharray="3 3"/>
  <line x1="365" y1="160" x2="385" y2="160"/>
  <line x1="365" y1="430" x2="385" y2="430"/>
  <!-- Section cut line -->
  <line x1="190" y1="20" x2="190" y2="460" stroke-dasharray="8 4" stroke-width="0.5"/>
  <!-- Annotation dot -->
  <circle cx="80" cy="200" r="2"/>
  <line x1="80" y1="200" x2="60" y2="180" stroke-width="0.5"/>
</svg>

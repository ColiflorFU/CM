<!-- Contact Section (Backup) -->
<section class="page-section contact-section position-relative" id="contact">
    <!-- Map Background (Placeholder Image) -->
    <div class="map-background position-absolute w-100 h-100 top-0 start-0"
        style="background-image: url('recursos/Miscelaneos/map-placeholder.jpg'); background-size: cover; background-position: center; filter: grayscale(100%) brightness(0.3);">
    </div>

    <div class="container px-4 px-lg-5 position-relative z-index-1">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <div class="card bg-dark-1 border-secondary shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="text-white font-montserrat fw-bold mb-2">Contáctanos</h2>
                            <p class="text-white-50 font-montserrat fw-light">Estamos listos para hacer realidad tu
                                proyecto.</p>
                        </div>

                        <form id="contactForm">
                            <!-- Name Input -->
                            <div class="form-floating mb-3">
                                <input class="form-control bg-transparent text-white border-secondary" id="name"
                                    type="text" placeholder="Tu Nombre" required />
                                <label for="name" class="text-white-50">Nombre de Contacto</label>
                            </div>

                            <!-- Email Input -->
                            <div class="form-floating mb-3">
                                <input class="form-control bg-transparent text-white border-secondary" id="email"
                                    type="email" placeholder="name@example.com" required />
                                <label for="email" class="text-white-50">Correo Electrónico</label>
                            </div>

                            <!-- Subject Input -->
                            <div class="form-floating mb-3">
                                <input class="form-control bg-transparent text-white border-secondary" id="subject"
                                    type="text" placeholder="Asunto" required />
                                <label for="subject" class="text-white-50">Asunto</label>
                            </div>

                            <!-- Message Input -->
                            <div class="form-floating mb-4">
                                <textarea class="form-control bg-transparent text-white border-secondary" id="message"
                                    placeholder="Detalle del mensaje" style="height: 15rem" required></textarea>
                                <label for="message" class="text-white-50">Detalle</label>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button class="btn btn-outline-accent btn-xl font-montserrat fw-bold" id="submitButton"
                                    type="submit">ENVIAR MENSAJE</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
